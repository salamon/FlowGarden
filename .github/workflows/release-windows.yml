name: Build Windows release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    name: Package Windows x64
    runs-on: windows-latest

    steps:
      - name: Check out the tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Verify tag and project versions
        shell: pwsh
        run: |
          $projectVersion = python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])"
          $packageVersion = python -c "import ast; tree=ast.parse(open('flowgarden/__init__.py', encoding='utf-8').read()); print(next(node.value.value for node in tree.body if isinstance(node, ast.Assign) and any(getattr(target, 'id', '') == '__version__' for target in node.targets)))"
          if ($env:GITHUB_REF_NAME -ne "v$projectVersion") {
            throw "Tag $env:GITHUB_REF_NAME does not match pyproject version $projectVersion"
          }
          if ($packageVersion -ne $projectVersion) {
            throw "Package version $packageVersion does not match project version $projectVersion"
          }

      - name: Install pinned build dependencies
        run: >-
          python -m pip install
          "glfw==2.10.2"
          "moderngl==5.12.0"
          "glcontext==3.0.0"
          "pyinstaller==6.21.0"
          .

      - name: Build the standalone folder
        run: >-
          python -m PyInstaller
          --noconfirm
          --clean
          --noupx
          --onedir
          --windowed
          --name FlowGarden
          --collect-binaries glfw
          --add-data "flowgarden/shaders;flowgarden/shaders"
          main.py

      - name: Add public documentation
        shell: pwsh
        run: Copy-Item README.md, LICENSE, PRIVACY.md -Destination dist/FlowGarden

      - name: Check package structure
        shell: pwsh
        run: |
          $requiredPaths = @(
            "dist/FlowGarden/FlowGarden.exe",
            "dist/FlowGarden/_internal",
            "dist/FlowGarden/README.md",
            "dist/FlowGarden/LICENSE",
            "dist/FlowGarden/PRIVACY.md"
          )
          foreach ($path in $requiredPaths) {
            if (-not (Test-Path -LiteralPath $path)) { throw "Missing package path: $path" }
          }
          if (-not (Get-ChildItem dist/FlowGarden -Recurse -Filter render.frag)) {
            throw "Packaged shaders were not found"
          }
          if (-not (Get-ChildItem dist/FlowGarden -Recurse -Filter glfw3.dll)) {
            throw "The packaged GLFW library was not found"
          }
          if (Get-ChildItem dist/FlowGarden -Recurse -Directory | Where-Object Name -In @("tools", "_artifacts")) {
            throw "Local QA files leaked into the package"
          }
          $process = Start-Process -FilePath dist/FlowGarden/FlowGarden.exe -ArgumentList "--help" -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Packaged executable check failed with exit code $($process.ExitCode)" }

      - name: Create ZIP and checksum
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path release | Out-Null
          Compress-Archive -Path dist/FlowGarden -DestinationPath release/FlowGarden-windows-x64.zip -CompressionLevel Optimal
          $hash = (Get-FileHash release/FlowGarden-windows-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  FlowGarden-windows-x64.zip" | Set-Content release/FlowGarden-windows-x64.zip.sha256 -NoNewline

      - name: Create or update the draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $archive = "release/FlowGarden-windows-x64.zip"
          $checksum = "release/FlowGarden-windows-x64.zip.sha256"
          $notes = @'
          FlowGarden's first release is an offline, shader-driven visual playground inspired by fluid motion and karesansui.

          **Important:** FlowGarden is an artistic simulation. Its numerical passes and rock response are deliberately tuned for visual behavior and are not a physically accurate fluid model.

          ## Windows download

          1. Download `FlowGarden-windows-x64.zip`.
          2. Extract the complete `FlowGarden` folder.
          3. Run `FlowGarden.exe`.

          A GPU and driver supporting OpenGL 4.1 or newer are required. This unsigned build has been prepared for Windows x64; Windows SmartScreen may display a warning. Linux and macOS remain source-level, unverified possibilities rather than supported release targets.

          FlowGarden has no accounts, telemetry, analytics, advertisements, automatic update checks, or runtime network connections.

          ## Highlights

          - Autonomous flow and hands-on zen-garden modes
          - Five color palettes and composition re-seeding
          - Randomized, draggable rocks with stylized flow redirection
          - Multi-monitor fullscreen
          - Translucent on-screen help with `H`
          '@

          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $archive $checksum --clobber
            gh release edit $tag --draft --title "FlowGarden $tag" --notes $notes
          } else {
            gh release create $tag $archive $checksum --verify-tag --draft --title "FlowGarden $tag" --notes $notes
          }
